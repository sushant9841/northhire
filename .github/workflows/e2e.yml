name: E2E regression suite

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # Real Cloudflare Turnstile keys live in this repo's .env (not committed) and gate seeker/
      # employer signup — see playwright.config.ts's own TURNSTILE_SITE_KEY/TURNSTILE_SECRET_KEY
      # override for the local dev-server case. In CI there is no .env at all, so signup already
      # runs uncaptcha'd by default; these are set explicitly (blank) so behavior doesn't depend
      # on that absence and stays correct if a future step ever provisions a real .env in CI.
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed dev database
        run: npm run server:seed

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces/videos on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
